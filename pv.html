<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3面シミュレーター PVプレビュー</title>
  <style>
    *{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:#0a0e14;color:#dce8ef;font-family:"Yu Gothic UI",Meiryo,sans-serif}
    canvas{display:block;width:100%;height:100%}
    .xr-entry-button{display:none!important}
    .pv-start-screen{position:fixed;z-index:100;inset:0;display:grid;place-items:center;background:#0a0e14}
    .pv-start-screen[hidden]{display:none}
    .pv-start-screen button{min-width:min(82vw,420px);padding:22px 32px;border:1px solid #41bfd4;border-radius:12px;background:#2596ad;color:#fff;font:700 clamp(18px,3vw,28px)/1.2 inherit;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.4)}
    .pv-start-screen button:disabled{border-color:#27394a;background:#15222f;color:#7a9bb0;cursor:wait;box-shadow:none}
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/pv/main.ts"></script>
</body>
</html>
